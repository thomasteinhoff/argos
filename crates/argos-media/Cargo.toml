[package]
name = "argos-media"
version.workspace = true
edition.workspace = true

[features]
# Which screen-capture backend is compiled in. `capture-native` is our own
# Desktop Duplication implementation; `capture-xcap` keeps the previous library
# available for one-release rollback / A-B comparison. Exactly one must be on.
default = ["capture-native"]
capture-native = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_UI_WindowsAndMessaging",
]
capture-xcap = ["dep:xcap"]

[dependencies]
argos-core = { path = "../argos-core" }
xcap = { version = "0.9.8", optional = true }
openh264 = "0.9.8"
wasapi = "0.24.0"
opus-rs = "0.1.33"
# Same crate version already pulled in by wasapi; only the process-enumeration feature is added.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
