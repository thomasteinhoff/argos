[package]
name = "argos-media"
version.workspace = true
edition.workspace = true

[features]
# Screen capture goes through our own Desktop Duplication implementation. The
# previous `xcap`-based backend was kept alongside it for a one-release A-B
# comparison; it never gained a test and was never built by a documented command,
# so it is gone rather than being a fallback nobody had exercised.
default = ["capture-native"]
capture-native = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_UI_WindowsAndMessaging",
]

[dependencies]
argos-core = { path = "../argos-core" }
openh264 = "0.9.8"
wasapi = "0.24.0"
opus-rs = "0.1.33"
# Same crate version already pulled in by wasapi; only the process-enumeration feature is added.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
